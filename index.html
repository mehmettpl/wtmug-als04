<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#1f8a4c" />
<title>Market Barkod Okuyucu</title>
<link rel="manifest" href="./manifest.json" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<header class="app-header">
  <div class="logo">🛒</div>
  <div>
    <h1>Market Barkod Okuyucu</h1>
    <div class="sub">Hızlı fiyat sorgula · Sepetini topla</div>
  </div>
</header>

<nav class="tabs">
  <button id="tabSingle" class="active" data-mode="single">
    🔍 Tekli Sorgu
  </button>
  <button id="tabCart" data-mode="cart">
    🧺 Sepet <span class="badge" id="cartBadge">0</span>
  </button>
</nav>

<main>
  <div class="camera-wrap">
    <video id="video" autoplay muted playsinline></video>
    <div class="placeholder" id="camPlaceholder">
      <div>
        <span class="icon">📷</span>
        Kamerayı başlatmak için aşağıdaki butona dokun
      </div>
    </div>
    <div class="frame"></div>
    <div class="hint">Barkodu çerçeveye hizalayın</div>
  </div>

  <div class="controls">
    <button id="btnStart" class="btn">▶️ Kamerayı Başlat</button>
    <button id="btnStop" class="btn secondary" disabled>⏹️ Durdur</button>
    <button id="btnFlash" class="btn secondary" disabled>🔦 Flaş Aç</button>
  </div>

  <div class="manual">
    <input id="manualInput" type="text" inputmode="numeric" placeholder="Barkod numarası girin..." />
    <button id="btnManual">Gönder</button>
  </div>

  <div id="message" class="message"></div>

  <!-- TEKLİ SORGU -->
  <section id="panelSingle" class="panel active">
    <div id="singleResult"></div>
  </section>

  <!-- SEPET -->
  <section id="panelCart" class="panel">
    <div class="card">
      <h3>🧺 Sepetim</h3>
      <ul id="cartList" class="cart-list"></ul>
      <div id="cartEmpty" class="empty">
        <span class="icon">🛍️</span>
        Henüz ürün okutulmadı.
      </div>
      <div class="total">
        <span class="label">Toplam Tutar</span>
        <span class="value" id="cartTotal">0,00 ₺</span>
      </div>
      <div class="controls">
        <button id="btnClearCart" class="btn danger block">🗑️ Sepeti Temizle</button>
      </div>
    </div>
  </section>

  <p class="footer-hint">BarcodeDetector desteklenmiyorsa elle giriş kullanılabilir.</p>
</main>

<script src="./app.js"></script>
</body>
</html>
